<h2 id="what">这是什么</h2>
<p>去中心化法权基础设施是一组开源协议与工具，目标是让契约的执行可以在多个担保人之间自由选择：押金由合约托管，争议由双方事先选定的人裁决，证据由当事人自行留存、任何人都能核验。</p>
